name: Build and Deploy to GKE (Fully Parallel Pipeline)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}

jobs:
  # =========================================================================
  # JOB 1: PREPARE UNIFIED TIMESTAMP DOCKER TAG
  # =========================================================================
  prepare-tag:
    name: Generate Unified Timestamp Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_step.outputs.docker_tag }}
    steps:
      - id: tag_step
        run: |
          TAG=$(date +'%y%m%d.%H%M%S')
          echo "docker_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "[+] Generated Unified Docker Tag: ${TAG}"

  # =========================================================================
  # JOB 2: PARALLEL BUILD & PUSH MATRIX FOR 5 MICROSERVICES
  # =========================================================================
  build-and-push-parallel:
    name: Build & Push (${{ matrix.service.name }})
    needs: prepare-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: agent-registry
            context: services/agent-registry
          - name: tool-registry
            context: services/tool-registry
          - name: document-registry-service
            context: services/document-registry
          - name: agent-london-backend
            context: backend
          - name: agent-london-frontend
            context: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build & Push Docker Image (${{ matrix.service.name }})
        env:
          DOCKER_TAG: ${{ needs.prepare-tag.outputs.docker_tag }}
          GCR_REGISTRY: gcr.io/${{ env.GCP_PROJECT }}
        run: |
          IMAGE_NAME="${{ matrix.service.name }}"
          CONTEXT_DIR="${{ matrix.service.context }}"

          REMOTE_TAGGED="${GCR_REGISTRY}/${IMAGE_NAME}:${DOCKER_TAG}"
          REMOTE_LATEST="${GCR_REGISTRY}/${IMAGE_NAME}:latest"

          echo "[+] Building Docker Image: ${IMAGE_NAME} with tag '${DOCKER_TAG}'..."
          docker build -t "${REMOTE_TAGGED}" -t "${REMOTE_LATEST}" "${CONTEXT_DIR}"

          echo "[+] Pushing ${REMOTE_TAGGED} to GCR..."
          docker push "${REMOTE_TAGGED}"

          echo "[+] Pushing ${REMOTE_LATEST} to GCR..."
          docker push "${REMOTE_LATEST}"

  # =========================================================================
  # JOB 3: PARALLEL KUBERNETES DEPLOYMENT MATRIX FOR ALL COMPONENTS
  # =========================================================================
  deploy-to-gke:
    name: Deploy (${{ matrix.k8s.name }})
    needs: [prepare-tag, build-and-push-parallel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - name: agent-registry
            manifest: deploy/k8s/01-agent-registry.yaml
            type: deployment
            target: agent-registry
          - name: tool-registry
            manifest: deploy/k8s/02-tool-registry.yaml
            type: deployment
            target: tool-registry
          - name: document-registry-service
            manifest: deploy/k8s/06-document-registry.yaml
            type: deployment
            target: document-registry
          - name: backend-bff
            manifest: deploy/k8s/03-backend.yaml
            type: deployment
            target: agent-london-backend
          - name: frontend-web
            manifest: deploy/k8s/04-frontend.yaml
            type: deployment
            target: agent-london-frontend
          - name: ingress-and-cert
            manifest: deploy/k8s/05-ingress.yaml
            type: ingress
            target: agents-london-ingress

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Reserve Static Global IP for Ingress
        run: |
          gcloud compute addresses create agents-london-global-ip --global --quiet || echo "Static IP 'agents-london-global-ip' already reserved."

      - name: Update Manifest Tag & Apply to GKE (${{ matrix.k8s.name }})
        env:
          DOCKER_TAG: ${{ needs.prepare-tag.outputs.docker_tag }}
        run: |
          MANIFEST_PATH="${{ matrix.k8s.manifest }}"
          sed -i "s|gcr.io/crajah-dev/|gcr.io/${GCP_PROJECT}/|g" "${MANIFEST_PATH}"
          sed -i "s|:latest|:${DOCKER_TAG}|g" "${MANIFEST_PATH}"

          echo "[+] Applying ${MANIFEST_PATH} to GKE..."
          kubectl apply -f "${MANIFEST_PATH}"

          if [ "${{ matrix.k8s.type }}" = "deployment" ]; then
            echo "[+] Verifying rollout status for deployment/${{ matrix.k8s.target }}..."
            kubectl rollout status deployment/${{ matrix.k8s.target }} --namespace default --timeout=600s
          fi

  # =========================================================================
  # JOB 4: FINAL CLUSTER & INGRESS VERIFICATION
  # =========================================================================
  verify-cluster:
    name: Verify Ingress Gateway & Cluster Health
    needs: [deploy-to-gke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Make Scripts Executable
        run: |
          chmod +x scripts/*.sh

      - name: Verify All Pods and Ingresses
        run: |
          kubectl get pods --namespace default
          kubectl get services --namespace default
          ./scripts/04_check_ingresses.sh
