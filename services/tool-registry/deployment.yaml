apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-registry
  namespace: default
  labels:
    app: tool-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tool-registry
  template:
    metadata:
      labels:
        app: tool-registry
    spec:
      containers:
      - name: tool-registry
        image: agents.london/tool-registry:v1.0.0
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: tool-registry-service
  namespace: default
spec:
  selector:
    app: tool-registry
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002
  type: ClusterIP
