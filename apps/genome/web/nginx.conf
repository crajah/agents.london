server {
  listen 80;
  root /usr/share/nginx/html;
  # entry HTML is never cacheable: a stale index pins users to dead asset
  # hashes and dead API bases across deploys ("disconnected" forever)
  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }
  location = /genome/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /genome/index.html =404;
  }
  location = /genome/index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location /genome/ {
    try_files $uri $uri/ /genome/index.html;
  }
  location / { try_files $uri $uri/ =404; }
}
