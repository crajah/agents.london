version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: agent-london-local-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: agent-london-local-postgres
    environment:
      - POSTGRES_USER=crajah
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-london-local-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=crajah
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=postgres
      - POSTGRES_URI=postgresql://crajah:postgrespassword@postgres:5432/postgres
      - OPENAI_API_BASE=http://host.docker.internal:4000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    depends_on:
      - redis
      - postgres
      - agent-registry
      - tool-registry
      - document-registry

  agent-registry:
    build:
      # Root context: these images copy shared/*.py alongside their own
      # sources, and their COPY paths are repo-root relative.
      context: .
      dockerfile: services/agent-registry/Dockerfile
    container_name: agent-london-local-agent-registry
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_URI=postgresql://crajah:postgrespassword@postgres:5432/postgres
      - REDIS_HOST=redis
      - LITELLM_SERVICE_URL=http://host.docker.internal:4000/v1
    depends_on:
      - postgres
      - redis

  tool-registry:
    build:
      # Root context: these images copy shared/*.py alongside their own
      # sources, and their COPY paths are repo-root relative.
      context: .
      dockerfile: services/tool-registry/Dockerfile
    container_name: agent-london-local-tool-registry
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_URI=postgresql://crajah:postgrespassword@postgres:5432/postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  document-registry:
    build:
      # Root context: these images copy shared/*.py alongside their own
      # sources, and their COPY paths are repo-root relative.
      context: .
      dockerfile: services/document-registry/Dockerfile
    container_name: agent-london-local-document-registry
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_URI=postgresql://crajah:postgrespassword@postgres:5432/postgres
      - OPENAI_API_BASE=http://host.docker.internal:4000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    depends_on:
      - postgres
