version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: agent-london-local-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: agent-london-local-postgres
    environment:
      - POSTGRES_USER=crajah
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-london-local-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=crajah
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=postgres
      - POSTGRES_URI=postgresql://crajah:postgrespassword@postgres:5432/postgres
      - OPENAI_API_BASE=http://localhost:4000/v1
      - OPENAI_API_KEY=BEVZ-6L81-OZ8Y
    depends_on:
      - redis
      - postgres
