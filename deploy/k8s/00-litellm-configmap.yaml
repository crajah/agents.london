apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
  labels:
    app: litellm-service
    component: model-router
data:
  # LiteLLM / Model Router
  OPENAI_API_BASE: "http://litellm-service.default.svc.cluster.local:80/v1"
  LITELLM_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  LITELLM_PROXY_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  MODEL_ROUTER_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  # Models
  DEFAULT_MODEL: "DeepSeek-V3.2"
  RAG_MODEL: "DeepSeek-V3.2"
  EMBEDDING_MODEL: "text-embedding-3-small"
  RAG_EMBEDDING_MODEL: "text-embedding-3-small"
  RAG_EMBEDDING_DIM: "1536"
  # Engine
  CIVILIZATION_ENGINE_TYPE: "GOOGLE_ADK"
  # Postgres
  POSTGRES_HOST: "postgres-service.default.svc.cluster.local"
  POSTGRES_PORT: "5432"
  # Internal service URLs
  AGENT_REGISTRY_URL: "http://agent-registry-service.default.svc.cluster.local:8001"
  TOOL_REGISTRY_URL: "http://tool-registry-service.default.svc.cluster.local:8002"
  DOCUMENT_REGISTRY_URL: "http://document-registry-service.default.svc.cluster.local:8003"
