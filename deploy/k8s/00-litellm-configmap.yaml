apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
  labels:
    app: litellm-service
    component: model-router
data:
  # LiteLLM / Model Router
  OPENAI_API_BASE: "http://litellm-service.default.svc.cluster.local:80/v1"
  LITELLM_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  LITELLM_PROXY_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  MODEL_ROUTER_URL: "http://litellm-service.default.svc.cluster.local:80/v1"
  # Models
  #
  # These names are the ones the code reads. Two of the previous four were not:
  # DEFAULT_MODEL and EMBEDDING_MODEL are read by nothing, so the cluster was
  # silently running the code's own defaults for the chat model while RAG_MODEL
  # — which *is* read — pinned retrieval to DeepSeek. The deployment was running
  # two different model families by accident, from names that did not match.
  DEFAULT_LLM_MODEL: "gemini-3.5-flash-lite"
  RAG_MODEL: "gemini-3.5-flash-lite"

  # The embedding model is NOT interchangeable. Vectors already in the database
  # were written in whichever model's geometry produced them, and both this and
  # the previous text-embedding-3-small are 1536 dimensions — so switching does
  # not raise, it silently makes every stored distance meaningless. Changing
  # this line requires reindexing every document space and every RAG realm.
  RAG_EMBEDDING_MODEL: "gemini-embedding-001"
  RAG_EMBEDDING_DIM: "1536"

  # Web search runs through this router's grounding rather than the Google
  # Custom Search API: "search the entire web" was withdrawn for new
  # Programmable Search engines on 20 January 2026 and ends for existing ones
  # on 1 January 2027. Empty turns web search off everywhere — no realm is
  # seeded with it and no agent is told it has it.
  WEB_SEARCH_MODEL: "gemini-3.5-flash-lite"
  # Engine
  # Postgres
  POSTGRES_HOST: "postgres-service.default.svc.cluster.local"
  POSTGRES_PORT: "5432"
  # Internal service URLs
  AGENT_REGISTRY_URL: "http://agent-registry-service.default.svc.cluster.local:8001"
  TOOL_REGISTRY_URL: "http://tool-registry-service.default.svc.cluster.local:8002"
  DOCUMENT_REGISTRY_URL: "http://document-registry-service.default.svc.cluster.local:8003"
