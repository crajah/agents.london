apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-registry
  namespace: default
  labels:
    app: document-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-registry
  template:
    metadata:
      labels:
        app: document-registry
    spec:
      containers:
        - name: document-registry
          image: gcr.io/marty-457112/document-registry-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          resources:
            # Ephemeral storage, not a volume. Nothing here needs to outlive a
            # pod: docling downloads its layout and OCR models to the container
            # filesystem on first use, and extraction writes each upload to a
            # temp file that is unlinked in a finally. Both want space, neither
            # wants persistence — a PersistentVolumeClaim buys nothing and, as
            # ReadWriteOnce, deadlocks the rolling update that replaces the pod.
            #
            # Undeclared, Autopilot grants a small default and evicts the pod
            # when the models exceed it: "The node was low on resource:
            # ephemeral-storage", mid-extraction, with the upload already
            # accepted.
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: GLOBAL_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: document-registry-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: document-registry
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
