apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-registry
  namespace: default
  labels:
    app: document-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-registry
  template:
    metadata:
      labels:
        app: document-registry
    spec:
      containers:
        - name: document-registry
          image: gcr.io/marty-457112/document-registry-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            # Docling downloads its layout and OCR models on first use. Without
            # a durable cache every pod restart re-downloads them and the first
            # extraction afterwards pays for it. Pointing both caches at the
            # shared volume is also what makes ReadWriteMany worth having:
            # replicas read one copy of the models instead of each fetching its
            # own, and the volume finally has a reader and a writer.
            - name: HF_HOME
              value: /app/cache/huggingface
            - name: DOCLING_ARTIFACTS_PATH
              value: /app/cache/docling
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: GLOBAL_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
          volumeMounts:
            - name: document-registry-cache
              mountPath: /app/cache
      volumes:
        - name: document-registry-cache
          persistentVolumeClaim:
            claimName: document-registry-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-registry-pvc
  namespace: default
spec:
  # ReadWriteMany, so a rolling update does not deadlock. A ReadWriteOnce volume
  # attaches to one node at a time, and a Deployment starts the replacement pod
  # before stopping the original — so the new pod waits for a volume the old pod
  # will not release until the new one is ready:
  #
  #   Multi-Attach error for volume "pvc-…": Volume is already used by pod(s) …
  #
  # That cannot resolve itself. Two cheaper routes to the same place, if the
  # shared model cache is not wanted: set strategy {type: Recreate} on the
  # Deployment and keep ReadWriteOnce, or drop the volume altogether.
  accessModes:
    - ReadWriteMany
  # Filestore multishare carves shares out of one managed instance instead of
  # provisioning a whole instance per claim, which is the difference between a
  # small share and a terabyte minimum.
  storageClassName: enterprise-multishare-rwx
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: document-registry-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: document-registry
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
