apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-registry
  namespace: default
  labels:
    app: document-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-registry
  template:
    metadata:
      labels:
        app: document-registry
    spec:
      containers:
        - name: document-registry
          image: gcr.io/marty-457112/document-registry-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: POSTGRES_HOST
              value: "postgres-service.default.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              value: "postgres"
            - name: OPENAI_API_BASE
              value: "http://litellm-service.default.svc.cluster.local:80/v1"
            - name: OPENAI_API_KEY
              value: "BEVZ-6L81-OZ8Y"
          volumeMounts:
            - name: document-registry-data
              mountPath: /app/data
      volumes:
        - name: document-registry-data
          persistentVolumeClaim:
            claimName: document-registry-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-registry-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: document-registry-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: document-registry
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
