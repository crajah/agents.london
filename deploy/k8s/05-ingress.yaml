apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-london-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agents-london-global-ip"
    networking.gke.io/managed-certificates: "agents-london-managed-cert"
spec:
  rules:
    - host: "agents.london"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-london-frontend-service
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agents-london-managed-cert
  namespace: default
spec:
  domains:
    - "agents.london"
