apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agents-london-managed-cert
  namespace: default
spec:
  domains:
    - "agents.london"
---
# BackendConfig for WebSocket support — increases timeout so GCE LB
# does not terminate long-lived WebSocket connections prematurely
# GCE's default health check probes "/" and requires 200. grafana-proxy answers
# "/" with a 301 (Grafana redirects to its login), so the backend was marked
# UNHEALTHY and /telemetry returned 502 while the pod itself was fine.
# /api/health is Grafana's own health endpoint and returns 200.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-proxy-backendconfig
  namespace: default
spec:
  healthCheck:
    type: HTTP
    requestPath: /api/health
    port: 3000
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agents-london-ws-backendconfig
  namespace: default
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-london-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agents-london-global-ip"
    networking.gke.io/managed-certificates: "agents-london-managed-cert"
spec:
  rules:
    - host: "agents.london"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          # litellm model router. The litellm Deployment sets
          # SERVER_ROOT_PATH=/proxy, because GCE Ingress forwards the path
          # unchanged and the backend would otherwise receive /proxy/v1/... and
          # 404. litellm keeps serving the unprefixed routes too, so in-cluster
          # callers on http://litellm-service/v1 are unaffected.
          #
          # This rule lives here because THIS manifest owns agents-london-ingress
          # and CI applies it on every push to main. It was previously added to
          # marty's infra/ingress/ingresses.yaml, which claims the same Ingress
          # object; the next pipeline run applied this file and silently deleted
          # the rule, leaving agents.london/proxy answering 404 from the
          # frontend's nginx while litellm itself was perfectly healthy.
          - path: /proxy
            pathType: Prefix
            backend:
              service:
                name: litellm-service
                port:
                  number: 80
          - path: /telemetry
            pathType: Prefix
            backend:
              service:
                name: grafana-proxy-service
                port:
                  number: 3000
          # authority: the platform's one front door (OIDC broker + JWKS);
          # strips its own prefix (AUTHORITY_PATH_PREFIX)
          - path: /authority
            pathType: Prefix
            backend:
              service:
                name: authority-service
                port:
                  number: 8810
          # genome + the landing page. genome-api strips its own prefix
          # (GENOME_PATH_PREFIX); the web image carries the landing at /
          # and the genome app built for /genome/.
          - path: /genome-api
            pathType: Prefix
            backend:
              service:
                name: genome-api-service
                port:
                  number: 80
          - path: /genome
            pathType: Prefix
            backend:
              service:
                name: genome-web-service
                port:
                  number: 80
          - path: /civilization
            pathType: Prefix
            backend:
              service:
                name: agent-london-frontend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genome-web-service
                port:
                  number: 80
---
# Nginx reverse proxy to bridge Grafana from telemetry namespace
# into default namespace (GCE Ingress does not support ExternalName services)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-proxy
  template:
    metadata:
      labels:
        app: grafana-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/nginx/conf.d/default.conf << 'CONF'
              server {
                listen 3000;
                location / {
                  proxy_pass http://grafana-service.telemetry.svc.cluster.local:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                }
              }
              CONF
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-proxy-service
  namespace: default
  annotations:
    # Without this the GCE backend uses the default "/" health check, which
    # this proxy answers with a 301, and /telemetry 502s.
    cloud.google.com/backend-config: '{"default": "grafana-proxy-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: grafana-proxy
  ports:
    - port: 3000
      targetPort: 3000
