apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agents-london-managed-cert
  namespace: default
spec:
  domains:
    - "agents.london"
---
# BackendConfig for WebSocket support — increases timeout so GCE LB
# does not terminate long-lived WebSocket connections prematurely
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agents-london-ws-backendconfig
  namespace: default
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-london-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agents-london-global-ip"
    networking.gke.io/managed-certificates: "agents-london-managed-cert"
spec:
  rules:
    - host: "agents.london"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /telemetry
            pathType: Prefix
            backend:
              service:
                name: grafana-proxy-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-london-frontend-service
                port:
                  number: 80
---
# Nginx reverse proxy to bridge Grafana from telemetry namespace
# into default namespace (GCE Ingress does not support ExternalName services)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-proxy
  template:
    metadata:
      labels:
        app: grafana-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/nginx/conf.d/default.conf << 'CONF'
              server {
                listen 3000;
                location / {
                  proxy_pass http://grafana-service.telemetry.svc.cluster.local:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                }
              }
              CONF
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-proxy-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: grafana-proxy
  ports:
    - port: 3000
      targetPort: 3000
