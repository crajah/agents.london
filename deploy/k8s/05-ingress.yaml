apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agents-london-managed-cert
  namespace: default
spec:
  domains:
    - "agents.london"
---
# BackendConfig for WebSocket support — increases timeout so GCE LB
# does not terminate long-lived WebSocket connections prematurely
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agents-london-ws-backendconfig
  namespace: default
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-london-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agents-london-global-ip"
    networking.gke.io/managed-certificates: "agents-london-managed-cert"
spec:
  rules:
    - host: "agents.london"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-london-backend-service
                port:
                  number: 8000
          - path: /telemetry
            pathType: Prefix
            backend:
              service:
                name: grafana-proxy-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-london-frontend-service
                port:
                  number: 80
---
# ExternalName service to proxy Grafana from telemetry namespace
# into default namespace so the ingress can route to it
apiVersion: v1
kind: Service
metadata:
  name: grafana-proxy-service
  namespace: default
spec:
  type: ExternalName
  externalName: grafana-service.telemetry.svc.cluster.local
  ports:
    - port: 3000
      targetPort: 3000
