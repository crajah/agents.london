apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-london-backend
  namespace: default
  labels:
    app: agent-london-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-london-backend
  template:
    metadata:
      labels:
        app: agent-london-backend
    spec:
      containers:
        - name: agent-london-backend
          image: gcr.io/marty-457112/agent-london-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: POSTGRES_HOST
              value: "postgres-service.default.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_HOST
                  optional: true
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PORT
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
                  optional: true
            - name: AGENT_REGISTRY_URL
              value: "http://agent-registry-service.default.svc.cluster.local:8001"
            - name: TOOL_REGISTRY_URL
              value: "http://tool-registry-service.default.svc.cluster.local:8002"
            - name: OPENAI_API_BASE
              value: "http://litellm-service.default.svc.cluster.local:80/v1"
            - name: OPENAI_API_KEY
              value: "BEVZ-6L81-OZ8Y"
            - name: GOOGLE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gcp-search-secrets
                  key: GOOGLE_SEARCH_API_KEY
                  optional: true
            - name: GOOGLE_SEARCH_CX
              valueFrom:
                secretKeyRef:
                  name: gcp-search-secrets
                  key: GOOGLE_SEARCH_CX
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-london-backend-service
  namespace: default
  labels:
    app: agent-london-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: agent-london-backend
