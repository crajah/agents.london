apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-london-backend
  namespace: default
  labels:
    app: agent-london-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-london-backend
  template:
    metadata:
      labels:
        app: agent-london-backend
    spec:
      containers:
        - name: agent-london-backend
          image: gcr.io/marty-457112/agent-london-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: RAG_SCHEMA_PER_REALM
              value: "1"
            - name: DOCREG_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: docreg-internal
                  key: DOCREG_INTERNAL_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: GLOBAL_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_HOST
                  optional: true
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PORT
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-auth-secret
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-auth-secret
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: MS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-auth-secret
                  key: MS_CLIENT_ID
                  optional: true
            - name: MS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-auth-secret
                  key: MS_CLIENT_SECRET
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-london-backend-service
  namespace: default
  labels:
    app: agent-london-backend
  annotations:
    cloud.google.com/backend-config: '{"default": "agents-london-ws-backendconfig"}'
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: agent-london-backend
