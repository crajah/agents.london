apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-registry
  namespace: default
  labels:
    app: tool-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-registry
  template:
    metadata:
      labels:
        app: tool-registry
    spec:
      containers:
        - name: tool-registry
          image: gcr.io/marty-457112/tool-registry:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: DOCREG_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: docreg-internal
                  key: DOCREG_INTERNAL_TOKEN
                  optional: true
            - name: TOOL_SECRET_ALLOWLIST
              value: "TAVILY_API_KEY,SERPER_API_KEY,RAPIDAPI_KEY,DOCREG_INTERNAL_TOKEN"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: GLOBAL_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
            # External providers. Every ref is optional: when a key is absent
            # the provider is simply not catalogued (spec Rule 7.3), so the
            # service starts and agents are never offered a tool that can only
            # answer 503. Create with:
            #   kubectl create secret generic external-tool-keys \
            #     --from-literal=SERPER_API_KEY=... \
            #     --from-literal=TAVILY_API_KEY_1=... \
            #     --from-literal=RAPIDAPI_KEY=...
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: TAVILY_API_KEY
                  optional: true
            - name: TAVILY_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: TAVILY_API_KEY_1
                  optional: true
            - name: TAVILY_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: TAVILY_API_KEY_2
                  optional: true
            - name: TAVILY_API_KEY_3
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: TAVILY_API_KEY_3
                  optional: true
            - name: TAVILY_API_KEY_4
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: TAVILY_API_KEY_4
                  optional: true
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: SERPER_API_KEY
                  optional: true
            - name: RAPIDAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: external-tool-keys
                  key: RAPIDAPI_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: tool-registry-service
  namespace: default
  labels:
    app: tool-registry
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: tool-registry
