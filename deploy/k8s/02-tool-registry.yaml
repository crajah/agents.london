apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-registry
  namespace: default
  labels:
    app: tool-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-registry
  template:
    metadata:
      labels:
        app: tool-registry
    spec:
      containers:
        - name: tool-registry
          image: gcr.io/crajah-dev/tool-registry:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: litellm-config
          env:
            - name: POSTGRES_HOST
              value: "postgres-service.default.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
                  optional: true
            - name: GOOGLE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gcp-search-secrets
                  key: GOOGLE_SEARCH_API_KEY
                  optional: true
            - name: GOOGLE_SEARCH_CX
              valueFrom:
                secretKeyRef:
                  name: gcp-search-secrets
                  key: GOOGLE_SEARCH_CX
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: tool-registry-service
  namespace: default
  labels:
    app: tool-registry
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: tool-registry
