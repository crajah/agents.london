# ==============================================================================
# agent.london Unified Kubernetes Manifest
# Deploys agent.london services in the same cluster as Marty LiteLLM routing
# ==============================================================================

---
# 1. Agent Registry Microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-registry
  namespace: default
  labels:
    app: agent-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-registry
  template:
    metadata:
      labels:
        app: agent-registry
    spec:
      containers:
      - name: agent-registry
        image: agents.london/agent-registry:v1.0.0
        ports:
        - containerPort: 8001
        env:
        - name: LITELLM_SERVICE_URL
          value: "http://litellm-service.default.svc.cluster.local:80/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-registry-service
  namespace: default
spec:
  selector:
    app: agent-registry
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP

---
# 2. Tool Registry Microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-registry
  namespace: default
  labels:
    app: tool-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tool-registry
  template:
    metadata:
      labels:
        app: tool-registry
    spec:
      containers:
      - name: tool-registry
        image: agents.london/tool-registry:v1.0.0
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: tool-registry-service
  namespace: default
spec:
  selector:
    app: tool-registry
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002
  type: ClusterIP

---
# 3. Backend BFF Microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-london-backend
  namespace: default
  labels:
    app: agent-london-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-london-backend
  template:
    metadata:
      labels:
        app: agent-london-backend
    spec:
      containers:
      - name: agent-london-backend
        image: agents.london/backend:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_BASE
          value: "http://litellm-service.default.svc.cluster.local:80/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-api-keys
              key: MASTER_KEY
              optional: true
        - name: AGENT_REGISTRY_URL
          value: "http://agent-registry-service.default.svc.cluster.local:8001"
        - name: TOOL_REGISTRY_URL
          value: "http://tool-registry-service.default.svc.cluster.local:8002"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-london-backend-service
  namespace: default
  annotations:
    cloud.google.com/backend-config: '{"default": "agents-london-ws-backendconfig"}'
spec:
  selector:
    app: agent-london-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
